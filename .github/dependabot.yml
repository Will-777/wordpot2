version: 2
updates:
  # Python dependencies (requirements.txt — Flask stack, pinned)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      flask-stack:
        patterns:
          - "Flask"
          - "Werkzeug"
          - "Jinja2"
          - "MarkupSafe"
          - "itsdangerous"
          - "click"

  # GitHub Actions (no workflows yet — keeps them current once added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
